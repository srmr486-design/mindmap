<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V. 디지털 문화 인터랙티브 마인드맵</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- D3.js v7 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <!-- FontAwesome for iconography -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Pretendard / Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    /* Node & Link SVG styles */
    .link {
      fill: none;
      stroke-width: 2.2px;
      transition: stroke 0.3s ease, stroke-width 0.2s ease, opacity 0.3s ease;
    }

    .node {
      cursor: pointer;
    }

    .node circle.main-circle {
      transition: transform 0.2s ease, stroke 0.2s ease, fill 0.2s ease;
    }

    .node text {
      font-family: 'Pretendard', sans-serif;
      transition: fill 0.2s ease, font-weight 0.2s ease;
      pointer-events: none; /* Prevents text interference */
    }

    /* Goal pill button: ZERO TRANSFORM to completely eliminate jitter/shaking */
    .goal-badge-group {
      cursor: pointer;
      pointer-events: all;
    }

    .goal-badge-bg {
      fill: #10b981;
      transition: fill 0.2s ease, filter 0.2s ease;
    }

    .goal-badge-group:hover .goal-badge-bg {
      fill: #047857; /* Deep emerald highlight without scale change */
      filter: drop-shadow(0 3px 6px rgba(16, 185, 129, 0.45));
    }

    .goal-badge-group:active .goal-badge-bg {
      fill: #065f46;
    }
  </style>
</head>

              <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-xl bg-indigo-600 text-white font-bold text-xs shadow-md shadow-indigo-600/20">1</span>

              <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-xl bg-emerald-600 text-white font-bold text-xs shadow-md shadow-emerald-600/20">2</span>
              <div class="pt-0.5">

                <p class="text-slate-800 dark:text-slate-100 text-xs sm:text-sm font-semibold leading-relaxed mt-0.5">
                  <span class="text-emerald-700 dark:text-emerald-300">CCL</span>을 활용하여 저작물을 공유할 수 있다.

          <!-- Modal Footer -->
          <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
            <span class="text-[11px] text-slate-400 dark:text-slate-500">배경이나 ESC를 눌러도 닫힙니다</span>
            <button id="btnConfirmGoal" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-semibold text-xs transition shadow-md shadow-emerald-600/25">
              확인

      <!-- SVG Rendering Canvas -->

    const mindmapData = {

      children: [

                },
                {

                },
                {

            {

  <script>
    // Theme Switcher Logic
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    function applyTheme(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        themeIcon.classList.replace('fa-moon', 'fa-sun');
      } else {
        document.documentElement.classList.remove('dark');
        themeIcon.classList.replace('fa-sun', 'fa-moon');
      }
    }

    const preferredTheme = localStorage.getItem('theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(preferredTheme === 'dark');

    themeToggleBtn.addEventListener('click', () => {
      const isCurrentlyDark = document.documentElement.classList.contains('dark');
      const nextTheme = !isCurrentlyDark;
      applyTheme(nextTheme);
      localStorage.setItem('theme', nextTheme ? 'dark' : 'light');
    });
  </script>

  <script>
    const container = document.getElementById('mindmap-container');
    const svg = d3.select("#mindmap-svg");
    const g = svg.append("g").attr("class", "mindmap-canvas");

    let width = container.clientWidth;
    let height = container.clientHeight;

    // Zoom setup
    const zoom = d3.zoom()
      .scaleExtent([0.3, 2.5])
      .on("zoom", (event) => {
        g.attr("transform", event.transform);
      });

    svg.call(zoom).on("dblclick.zoom", null);

    let root;
    let i = 0;
    const duration = 500;
    let activeFocusedNode = null;

    // Tree layout configuration
    const tree = d3.tree().nodeSize([54, 250]);

    // Initialize root hierarchy
    root = d3.hierarchy(mindmapData, d => d.children);
    root.x0 = height / 2;
    root.y0 = 80;

    // Collapse nodes helper
    function collapse(d) {
      if (d.children) {
        d._children = d.children;
        d._children.forEach(collapse);
        d.children = null;
      }
    }

    // Default state: Collapse everything under root on startup
    if (root.children) {
      root.children.forEach(collapse);
    }

    // Center viewport to the midpoint between selected node and its parent
    function focusBetweenParentAndNode(targetNode) {
      const refNode = targetNode.parent ? targetNode.parent : root;
      
      const midX = (refNode.x + targetNode.x) / 2;
      const midY = (refNode.y + targetNode.y) / 2;

      const scale = targetNode.depth >= 2 ? 1.05 : 0.95;
      const viewCenterX = width / 2;
      const viewCenterY = height / 2;

      const transform = d3.zoomIdentity
        .translate(viewCenterX, viewCenterY)
        .scale(scale)
        .translate(-midY, -midX);

      svg.transition()
        .duration(600)
        .ease(d3.easeCubicOut)
        .call(zoom.transform, transform);
    }

    // Learning Goals Modal Controls
    const modal = document.getElementById('learningGoalModal');
    const modalContent = document.getElementById('learningGoalCard');

    function showLearningGoalsModal() {
      modal.classList.remove('opacity-0', 'pointer-events-none');
      modal.classList.add('opacity-100');
      modalContent.classList.remove('scale-95');
      modalContent.classList.add('scale-100');
    }

    function hideLearningGoalsModal() {
      modal.classList.add('opacity-0', 'pointer-events-none');
      modal.classList.remove('opacity-100');
      modalContent.classList.add('scale-95');
      modalContent.classList.remove('scale-100');
    }

    document.getElementById('btnCloseGoal').addEventListener('click', hideLearningGoalsModal);
    document.getElementById('btnConfirmGoal').addEventListener('click', hideLearningGoalsModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) hideLearningGoalsModal();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hideLearningGoalsModal();
    });

    // Render / Update D3 Tree
    function update(source) {
      const treeData = tree(root);
      const nodes = treeData.descendants();
      const links = treeData.links();

      // Normalize depth distance
      nodes.forEach(d => {
        d.y = d.depth * 250 + 100;
      });

      // -------------------- NODES --------------------
      const node = g.selectAll('g.node')
        .data(nodes, d => d.id || (d.id = ++i));

      // Enter new nodes at parent's previous position
      const nodeEnter = node.enter().append('g')
        .attr('class', 'node')
        .attr("transform", d => `translate(${source.y0},${source.x0})`)
        .on('click', (event, d) => {
          // Pure expand/collapse only
          event.stopPropagation();
          activeFocusedNode = d;

          if (d.children) {
            d._children = d.children;
            d.children = null;
          } else if (d._children) {
            d.children = d._children;
            d._children = null;
          }

          update(d);
          focusBetweenParentAndNode(d);
        });

      // Node base circle
      nodeEnter.append('circle')
        .attr('class', 'main-circle')
        .attr('r', 1e-6)
        .attr('fill', d => d.data.color || '#6366f1')
        .attr('stroke', '#ffffff')
        .attr('stroke-width', 2.5);

      // Node indicator (+ / -) for collapsible children
      nodeEnter.append('circle')
        .attr('class', 'indicator-circle')
        .attr('cx', 12)
        .attr('cy', -10)
        .attr('r', d => (d._children || d.children) ? 7 : 0)
        .attr('fill', d => d._children ? '#f43f5e' : '#10b981')
        .attr('stroke', '#ffffff')
        .attr('stroke-width', 1.5)
        .style('display', d => (d._children || d.children) ? 'block' : 'none');

      nodeEnter.append('text')
        .attr('class', 'indicator-text')
        .attr('x', 12)
        .attr('y', -7.5)
        .attr('text-anchor', 'middle')
        .attr('font-size', '8px')
        .attr('font-weight', 'bold')
        .attr('fill', '#ffffff')
        .text(d => d._children ? '+' : (d.children ? '−' : ''))
        .style('display', d => (d._children || d.children) ? 'block' : 'none');

      // Category badge above root and level-1 nodes
      nodeEnter.filter(d => d.depth <= 1)
        .append('text')
        .attr('dy', '-1.35em')
        .attr('x', d => d.children || d._children ? -16 : 16)
        .attr('text-anchor', d => d.children || d._children ? 'end' : 'start')
        .text(d => d.data.category || '')
        .attr('font-size', '9px')
        .attr('font-weight', '600')
        .attr('fill', d => d.data.color || '#6366f1')
        .attr('opacity', 0.85);

      // Node title text
      nodeEnter.append('text')
        .attr('class', 'node-title fill-slate-800 dark:fill-slate-100')
        .attr('dy', '.35em')
        .attr('x', d => d.children || d._children ? -16 : 16)
        .attr('text-anchor', d => d.children || d._children ? 'end' : 'start')
        .text(d => d.data.name)
        .attr('font-size', d => d.depth === 0 ? '15px' : (d.depth === 1 ? '13px' : '12px'))
        .attr('font-weight', d => d.depth <= 1 ? '700' : '500');

      // Stable, jitter-free <학습목표> badge button ONLY for the "정보 공유" (node_2_1) node
      const infoSharingNodes = nodeEnter.filter(d => d.data.id === 'node_2_1');
      
      const badgeGroup = infoSharingNodes.append('g')
        .attr('class', 'goal-badge-group')
        .attr('transform', 'translate(-152, -12)')
        // Stop all propagation on hover and click events to prevent node toggle or shake loops
        .on('mouseenter', (event) => event.stopPropagation())
        .on('mouseleave', (event) => event.stopPropagation())
        .on('mousedown', (event) => event.stopPropagation())
        .on('touchstart', (event) => event.stopPropagation())
        .on('click', (event) => {
          event.stopPropagation();
          showLearningGoalsModal();
        });

      // Generous invisible hit area to make hovering & clicking smooth and effortless
      badgeGroup.append('rect')
        .attr('x', -4)
        .attr('y', -4)
        .attr('width', 88)
        .attr('height', 30)
        .attr('fill', 'transparent')
        .attr('stroke', 'none');

      // Visible styled button background
      badgeGroup.append('rect')
        .attr('class', 'goal-badge-bg')
        .attr('width', 80)
        .attr('height', 22)
        .attr('rx', 11)
        .attr('stroke', '#ffffff')
        .attr('stroke-width', 1.5)
        .style('filter', 'drop-shadow(0 2px 4px rgba(16, 185, 129, 0.35))');

      // Button text label with bookmark icon
      badgeGroup.append('text')
        .attr('x', 40)
        .attr('y', 14.5)
        .attr('text-anchor', 'middle')
        .attr('font-size', '10.5px')
        .attr('font-weight', '700')
        .attr('fill', '#ffffff')
        .style('pointer-events', 'none')
        .text('🎯 학습목표');

      // Transition nodes to new position
      const nodeUpdate = node.merge(nodeEnter).transition().duration(duration)
        .attr("transform", d => `translate(${d.y},${d.x})`);

      nodeUpdate.select('circle.main-circle')
        .attr('r', d => d.depth === 0 ? 12 : (d.depth === 1 ? 9 : 7))
        .attr('fill', d => d.data.color || '#6366f1')
        .attr('stroke', d => (activeFocusedNode && activeFocusedNode.id === d.id) ? '#38bdf8' : '#ffffff')
        .attr('stroke-width', d => (activeFocusedNode && activeFocusedNode.id === d.id) ? 3.5 : 2);

      nodeUpdate.select('.indicator-circle')
        .attr('r', d => (d._children || d.children) ? 7 : 0)
        .attr('fill', d => d._children ? '#f43f5e' : '#10b981')
        .style('display', d => (d._children || d.children) ? 'block' : 'none');

      nodeUpdate.select('.indicator-text')
        .text(d => d._children ? '+' : (d.children ? '−' : ''))
        .style('display', d => (d._children || d.children) ? 'block' : 'none');

      // Transition exiting nodes
      const nodeExit = node.exit().transition().duration(duration)
        .attr("transform", d => `translate(${source.y},${source.x})`)
        .remove();

      nodeExit.select('circle').attr('r', 1e-6);
      nodeExit.select('text').style('fill-opacity', 1e-6);

      // -------------------- LINKS --------------------
      const link = g.selectAll('path.link')
        .data(links, d => d.target.id);

      const linkEnter = link.enter().insert('path', "g")
        .attr("class", "link")
        .attr('stroke-opacity', 0.45)
        .style('stroke', d => d.target.data.color || '#818cf8')
        .attr('d', d => {
          const o = {x: source.x0, y: source.y0};
          return diagonal(o, o);
        });

      link.merge(linkEnter).transition().duration(duration)
        .style('stroke', d => d.target.data.color || '#818cf8')
        .attr('stroke-opacity', 0.5)
        .attr('d', d => diagonal(d.source, d.target));

      link.exit().transition().duration(duration)
        .attr('d', d => {
          const o = {x: source.x, y: source.y};
          return diagonal(o, o);
        })
        .remove();

      // Stash current positions for transitions
      nodes.forEach(d => {
        d.x0 = d.x;
        d.y0 = d.y;
      });
    }

    // Bezier curve path generator
    function diagonal(s, d) {
      return `M ${s.y} ${s.x}
              C ${(s.y + d.y) / 2} ${s.x},
                ${(s.y + d.y) / 2} ${d.x},
                ${d.y} ${d.x}`;
    }

    // Toolbar Operations
    function expandAll(d) {
      if (d._children) {
        d.children = d._children;
        d._children = null;
      }
      if (d.children) {
        d.children.forEach(expandAll);
      }
    }

    function collapseAll(d) {
      if (d.children && d.depth >= 1) {
        d._children = d.children;
        d._children.forEach(collapseAll);
        d.children = null;
      } else if (d.children) {
        d.children.forEach(collapseAll);
      }
    }

    document.getElementById('btnExpandAll').addEventListener('click', () => {
      expandAll(root);
      update(root);
      resetView();
    });

    document.getElementById('btnCollapseAll').addEventListener('click', () => {
      collapseAll(root);
      update(root);
      resetView();
    });

    function resetView() {
      const transform = d3.zoomIdentity
        .translate(width / 3, height / 2)
        .scale(1.05);
      svg.transition().duration(600).call(zoom.transform, transform);
    }

    document.getElementById('btnResetZoom').addEventListener('click', resetView);

    document.getElementById('btnZoomIn').addEventListener('click', () => {
      svg.transition().duration(300).call(zoom.scaleBy, 1.25);
    });

    document.getElementById('btnZoomOut').addEventListener('click', () => {
      svg.transition().duration(300).call(zoom.scaleBy, 0.8);
    });

    window.addEventListener('resize', () => {
      width = container.clientWidth;
      height = container.clientHeight;
      svg.attr('width', width).attr('height', height);
    });

    // Initial load
    window.addEventListener('DOMContentLoaded', () => {
      update(root);
      resetView();
    });
  </script>
</body>
</html>
